name = "bazaarplusplus-mod-api"
main = "src/index.ts"
compatibility_date = "2026-03-28"
workers_dev = false

[[routes]]
pattern = "mod-api.bazaarplusplus.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "bazaarplusplus-mod-api-db"
database_id = "6cf4ec06-c479-4275-a533-6c704624cffe"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "bazaarplusplus-replays"

[triggers]
crons = ["0 */6 * * *"]
